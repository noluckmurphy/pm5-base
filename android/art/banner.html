<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: B; font-weight: 800; src: url(../../tv/fonts/barlow-condensed-latin-800-normal.woff2); }
html,body{margin:0}
.b{width:320px;height:180px;background:#0b1f3f;position:relative;display:flex;align-items:center;gap:14px;padding:0 18px;box-sizing:border-box;overflow:hidden}
.b img{width:96px;height:96px;flex:none}
.t{font-family:B;font-weight:800;color:#f5f7fa;font-size:60px;line-height:.9;letter-spacing:.01em;white-space:nowrap;margin-bottom:8px}
.t small{display:block;font-size:19px;letter-spacing:.22em;color:#9aa8c0;margin-top:8px}
.rule{position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(#c8102e 0 33%,#f5f7fa 33% 66%,#c8102e 66%)}
.i{width:192px;height:192px;background:#0b1f3f;display:flex;align-items:center;justify-content:center}
.i img{width:150px;height:150px}
</style></head><body>
<div class="b" id="banner"><img src="../../tv/img/crest.svg"><div class="t">ERG TV<small>LIVE SPLITS</small></div><div class="rule"></div></div>
<div class="i" id="icon"><img src="../../tv/img/crest.svg"></div>
</body></html>
