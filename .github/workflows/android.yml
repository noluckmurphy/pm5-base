name: Android TV app

on:
  push:
    paths:
      - 'android/**'
      - 'tv/**'
      - 'lib/**'
      - 'ui/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
      - run: node --test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/erg-tv.apk
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: erg-tv-apk
          path: out/erg-tv.apk
      # Master builds replace the APK on the rolling `tv-latest` pre-release,
      # so the TV install step always has one stable URL:
      # https://github.com/<owner>/pm5-base/releases/download/tv-latest/erg-tv.apk
      # claude/* branch builds go to `tv-preview` instead, so trying out a
      # branch never changes what the TV gets from tv-latest.
      - name: Publish the APK to a rolling release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref == 'refs/heads/master' && 'tv-latest' || 'tv-preview' }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "Erg TV ($TAG)" \
              --notes "Rolling build of the Android TV app. Install with: adb install -r -g erg-tv.apk"
          gh release upload "$TAG" out/erg-tv.apk --clobber
          gh release edit "$TAG" --notes "Rolling build of the Android TV app from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install with: adb install -r -g erg-tv.apk"
